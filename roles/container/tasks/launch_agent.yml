---
- name: Ensure the LaunchAgents directory exists
  ansible.builtin.file:
    path: "{{ launch_agents_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: staff

- name: Apply Launch Agent for Apple Container
  ansible.builtin.template:
    src: com.apple.container.plist.j2
    dest: "{{ launch_agents_dir }}/{{ container_launchagent_label }}.plist"
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: staff
  register: container_launch_agent_plist

- name: Check if Apple Container Launch Agent is already loaded
  ansible.builtin.command:
    argv:
      - launchctl
      - list
      - "{{ container_launchagent_label }}"
  register: container_launchctl
  failed_when: false
  changed_when: false

- name: Load Apple Container Launch Agent
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - gui/{{ ansible_user_uid }}
      - "{{ launch_agents_dir }}/{{ container_launchagent_label }}.plist"
  when: container_launchctl.rc != 0
  changed_when: true

- name: Restart Apple Container Launch Agent (upgraded or reconfigured)
  ansible.builtin.command:
    argv:
      - launchctl
      - kickstart
      - -k
      - "gui/{{ ansible_user_uid }}/{{ container_launchagent_label }}"
  when:
    - container_launchctl.rc == 0
    - container_install_result.changed or container_launch_agent_plist.changed
  changed_when: true
