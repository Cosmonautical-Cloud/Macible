---
# In check mode the homebrew role only reports mas as installed, so on a Mac
# without it the App Store step is skipped instead of failing.
- name: Check for mas
  ansible.builtin.stat:
    path: "{{ homebrew_dir }}/bin/mas"
  register: xcode_mas

# Installs mas and every app in mas_installed_apps, Xcode among them.
- name: Install App Store apps
  ansible.builtin.include_role:
    name: geerlingguy.mac.mas
  when: not ansible_check_mode or xcode_mas.stat.exists

- name: Check Xcode is installed
  ansible.builtin.stat:
    path: "{{ xcode_app }}"
  register: xcode_app_stat

- name: Assert Xcode is installed
  ansible.builtin.assert:
    that: xcode_app_stat.stat.exists
    fail_msg: >-
      {{ xcode_app }} doesn't exist. Make sure Xcode (497799835) is in
      mas_installed_apps and that you're signed in to the App Store on this
      Mac - mas can't sign in on its own.
    quiet: true
  when: not ansible_check_mode

- name: Configure Xcode
  ansible.builtin.include_tasks: configure.yml
  when: xcode_app_stat.stat.exists
